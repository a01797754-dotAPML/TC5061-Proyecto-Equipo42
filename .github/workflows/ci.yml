name: CI/CD

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "references/**", "notebooks/**"]
  pull_request:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "references/**", "notebooks/**"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  IMAGE_NAME: mibici-api

jobs:
  tests:
    name: Pruebas (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Correr PyTest
        run: python -m pytest tests -q -p no:cacheprovider | tee pytest.log

      - name: Resumen de pruebas
        if: always()
        run: |
          echo "### Pruebas en ${{ matrix.os }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          tail -n 1 pytest.log >> "$GITHUB_STEP_SUMMARY" || echo "sin resultados" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build y publicación de la imagen
    needs: tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLICAR: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v7

      - name: Nombre de la imagen (GHCR exige minúsculas)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${IMAGE_NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Login a GitHub Container Registry
        if: env.PUBLICAR == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build (y push solo en main)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Containerfile
          push: ${{ env.PUBLICAR == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen de la imagen
        run: |
          echo "### Imagen" >> "$GITHUB_STEP_SUMMARY"
          echo "Publicada en GHCR: ${PUBLICAR}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  compose:
    name: Despliegue con Compose + smoke test
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validar compose.yaml
        run: docker compose config --quiet

      - name: Levantar el sistema (un solo comando)
        run: docker compose up -d --build

      - name: Esperar a que la API y MLflow respondan
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health && curl -fsS http://localhost:5000/health; then
              echo; echo "Servicios arriba después de $((i * 5)) s"; exit 0
            fi
            sleep 5
          done
          echo "Los servicios no respondieron a tiempo"; exit 1

      - name: Smoke test de /predict
        run: |
          code=$(curl -s -o predict.json -w "%{http_code}" -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" \
            -d '{"hora_dia": 8, "dia_semana": 2, "es_fin_semana": 0, "mes": 8, "capacidad": 20,
                 "salidas_lag_1": 2, "salidas_lag_2": 3, "salidas_lag_24": 2, "salidas_lag_168": 4,
                 "salidas_media_24h": 2.5, "salidas_media_4sem": 3.1}')
          cat predict.json; echo
          test "$code" = "200"
          jq -e '.prediction | type == "number"' predict.json

      - name: Smoke test de validación (422)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST http://localhost:8000/predict \
            -H "Content-Type: application/json" -d '{"hora_dia": 25}')
          test "$code" = "422"

      - name: Estado y consumo de los contenedores
        if: always()
        run: |
          docker compose ps
          docker stats --no-stream --format "table {{.Name}}\t{{.CPUPerc}}\t{{.MemUsage}}" | tee stats.txt
          {
            echo "### Despliegue con Compose"
            echo "Respuesta de /predict: \`$(cat predict.json 2>/dev/null || echo 'sin respuesta')\`"
            echo '```'
            cat stats.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Logs si algo falla
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Bajar el sistema
        if: always()
        run: docker compose down -v

  resumen:
    name: Resumen del pipeline
    needs: [tests, build, compose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Tabla de resultados
        run: |
          {
            echo "## Resultado del pipeline (${{ github.event_name }}, ${GITHUB_SHA::7})"
            echo "| Job | Resultado |"
            echo "|---|---|"
            echo "| Pruebas (ubuntu + windows) | ${{ needs.tests.result }} |"
            echo "| Build / publicación de imagen | ${{ needs.build.result }} |"
            echo "| Despliegue con Compose + smoke test | ${{ needs.compose.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fallar si algún job falló
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
